name: Build and push release image

on:
  push:
    branches:
      # Run on pushing branches like `release/1.0.0`
      - "release/*.*.*"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-release-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build project
        run: make quick-release KUBE_RELEASE_RUN_TESTS="n" KUBE_BUILD_PLATFORMS="linux/amd64"
      
      - name: Image digest
        run: echo "Successfully pushed ghcr.io/saymololy/kubernetes:v1.22.17"